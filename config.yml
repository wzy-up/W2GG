DATALOADER:
  NUM_WORKERS: 12
DATASETS:
  NAME: tacos
  PSEUDO_GLANCE:
    FILTER_THRESHOLD_SCALE: 1.0
    KEYFRAME_MODE: multi
    MAX_KEYFRAMES: 0
    REFINEMENT: dedup_filter
    SELECTED_FRAMES_FILE: ''
    SELECTED_FRAMES_KEY: ''
    SELECTOR: rba
    WEIGHT_MODE: confidence
  PSEUDO_GMASK:
    KEEP_RATIO: 0.42
    MARGIN: 3
    MIN_KEEP: 24
    MODE: qpm
  TEST:
  - tacos_test
  TRAIN:
  - tacos_train
INPUT:
  NUM_PRE_CLIPS: 256
MODEL:
  ARCHITECTURE: W2GG
  W2GG:
    FEAT2D:
      NAME: pool
      POOLING_COUNTS:
      - 15
      - 8
      - 8
      - 8
    FEATPOOL:
      HIDDEN_SIZE: 512
      INPUT_SIZE: 4096
      KERNEL_SIZE: 2
    JOINT_SPACE_SIZE: 256
    LOSS:
      BCE_WEIGHT: 1
      CONTRASTIVE_WEIGHT: 0.1
      MARGIN: 0.1
      MAX_IOU: 0.7
      MIN_IOU: 0.3
      NEGATIVE_VIDEO_IOU: 0.5
      NUM_POSTIVE_VIDEO_PROPOSAL: 3
      PAIRWISE_SENT_WEIGHT: 0.0
      SENT_REMOVAL_IOU: 0.5
      TAU_SENT: 0.1
      TAU_VIDEO: 0.1
    NUM_CLIPS: 128
    PREDICTOR:
      HIDDEN_SIZE: 512
      KERNEL_SIZE: 5
      NUM_STACK_LAYERS: 8
    TEXT_ENCODER:
      NAME: BERT
  DEVICE: cuda
OUTPUT_DIR: .
SOLVER:
  BATCH_SIZE: 4
  CENTER_NEG_THRESH: 0.6
  CENTER_POS_THRESH: 0.9
  CHECKPOINT_PERIOD: 260
  DGA:
    CONTINUOUS_NUM: 2
    EMA_ALPHA: 0.7
    FALLBACK_TO_TOP_ANCHOR: true
    MODE: multi_weighted
  FREEZE_BERT: 40
  LR: 0.0015
  MAX_EPOCH: 250
  MILESTONES:
  - 130
  - 190
  ONLY_IOU: 100
  RESUME: false
  RESUME_EPOCH: 101
  SIGMA: 0.2
  SKIP_TEST: 0
  TEST_PERIOD: 10
  THRESH: 0.9
  TOPK: 20
  USE_DGA: true
  WINDOW: 8
TEST:
  BATCH_SIZE: 16
  CONTRASTIVE_SCORE_POW: 0.3
  NMS_THRESH: 0.4
