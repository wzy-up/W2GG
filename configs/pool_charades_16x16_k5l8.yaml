MODEL:
  ARCHITECTURE: "W2GG"
  W2GG:
    NUM_CLIPS: 16
    JOINT_SPACE_SIZE: 512
    FEATPOOL:
      INPUT_SIZE: 1024
      HIDDEN_SIZE: 512
      KERNEL_SIZE: 2
    FEAT2D:
      NAME: "pool"
      POOLING_COUNTS: [15]
    TEXT_ENCODER:
      NAME: "BERT"
    PREDICTOR:
      HIDDEN_SIZE: 512
      KERNEL_SIZE: 5
      NUM_STACK_LAYERS: 8
    LOSS:
      MIN_IOU: 0.5
      MAX_IOU: 1.0
      NUM_POSTIVE_VIDEO_PROPOSAL: 1
      NEGATIVE_VIDEO_IOU: 0.5
      SENT_REMOVAL_IOU: 0.5
      TAU_VIDEO: 0.1
      TAU_SENT: 0.1
      MARGIN: 0.4
      CONTRASTIVE_WEIGHT: 0.05
DATASETS:
  PSEUDO_GLANCE:
    KEYFRAME_MODE: "multi"
    MAX_KEYFRAMES: 0
    REFINEMENT: "dedup_filter"
    FILTER_THRESHOLD_SCALE: 1.0
    WEIGHT_MODE: "confidence"
  NAME: "charades"
  TRAIN: ("charades_train", )
  TEST: ("charades_test",)
  PSEUDO_GMASK:
    MODE: "qpm"
    KEEP_RATIO: 0.41
    MIN_KEEP: 24
    MARGIN: 3
INPUT:
  NUM_PRE_CLIPS: 32
DATALOADER:
  NUM_WORKERS: 0
SOLVER:
  LR: 0.0001
  BATCH_SIZE: 48
  MILESTONES: (8, 13)
  MAX_EPOCH: 18
  TEST_PERIOD: 1
  CHECKPOINT_PERIOD: 20
  RESUME: False
  RESUME_EPOCH: 7
  FREEZE_BERT: 4
  ONLY_IOU: 7
  SKIP_TEST: 0
  SIGMA: 0.6
  TOPK: 10
  USE_DGA: True
  DGA:
    MODE: "multi_weighted"
    CONTINUOUS_NUM: 1
    EMA_ALPHA: 0.7
    FALLBACK_TO_TOP_ANCHOR: True
  WINDOW: 2
  THRESH: 0.9
  CENTER_POS_THRESH: 0.90
  CENTER_NEG_THRESH: 0.60

TEST:
  NMS_THRESH: 0.5
  BATCH_SIZE: 48
  CONTRASTIVE_SCORE_POW: 0.5